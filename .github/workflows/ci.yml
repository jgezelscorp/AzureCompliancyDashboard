name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        run: |
          if git grep -nIE -- '-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.' -- . ':!.github/workflows/ci.yml'; then
            echo "Possible secret found"; exit 1
          fi

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate fixtures against contracts
        run: |
          pip install jsonschema
          python scripts/validate_fixtures.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  bicep-workbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Bicep and workbook JSON
        run: |
          shopt -s globstar nullglob
          for f in infra/bicep/**/*.bicep; do az bicep build --file "$f" --stdout > /dev/null; done
          for f in workbooks/**/*.json; do python -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; done
      - name: Validate workbook structure, KQL sanity and Bicep template
        run: |
          pip install jsonschema pytest
          python scripts/validate_workbook.py --bicep
      - name: Workbook KQL-logic parity with metrics reference
        run: pytest tests/workbook -q
